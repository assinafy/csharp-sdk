name: Live integration

# Exercises the SDK against the Assinafy sandbox. Runs on demand and nightly.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily

permissions:
  contents: read

concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: Live sandbox tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 30
    env:
      ASSINAFY_BASE_URL: https://sandbox.assinafy.com.br/v1

    steps:
      - name: Validate sandbox configuration
        shell: bash
        env:
          ASSINAFY_API_KEY: ${{ secrets.ASSINAFY_API_KEY }}
          ASSINAFY_ACCOUNT_ID: ${{ secrets.ASSINAFY_ACCOUNT_ID }}
        run: |
          missing=0
          for name in ASSINAFY_API_KEY ASSINAFY_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.424
            9.0.317
            10.0.400

      - name: Run live integration tests
        env:
          ASSINAFY_API_KEY: ${{ secrets.ASSINAFY_API_KEY }}
          ASSINAFY_ACCOUNT_ID: ${{ secrets.ASSINAFY_ACCOUNT_ID }}
        run: >-
          dotnet test --project tests/Assinafy.Sdk.Tests/Assinafy.Sdk.Tests.csproj
          --configuration Release
          --framework net10.0
          --
          --filter-trait "Category=Live"
