name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only needs to read the repo; artifact upload works under read-only contents.
permissions:
  contents: read

# Cancel superseded runs on the same ref (a new push/force-push supersedes the prior matrix run).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.tfm }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tfm: [net8.0, net9.0, net10.0]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.424
            9.0.317
            10.0.400

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore --framework ${{ matrix.tfm }}

      - name: Test
        run: >-
          dotnet test --project tests/Assinafy.Sdk.Tests/Assinafy.Sdk.Tests.csproj
          --configuration Release
          --no-build
          --framework ${{ matrix.tfm }}
          --results-directory ./test-results
          --
          --filter-not-trait "Category=Live"
          --report-xunit-trx
          --report-xunit-trx-filename "test-results-${{ matrix.tfm }}.trx"
          --coverlet
          --coverlet-output-format cobertura
          --coverlet-file-prefix "${{ matrix.tfm }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.tfm }}
          path: ./test-results
          if-no-files-found: ignore

  pack:
    name: Pack (verify)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.424
            9.0.317
            10.0.400

      - name: Verify production API snapshot
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 3 \
            https://api.assinafy.com.br/v1/docs/openapi.json \
            --output "$RUNNER_TEMP/openapi.json"
          snapshot_filter='
            .paths["/v1/authentication/reset-password"].put.requestBody.content["application/json"].schema.properties.token.example = "example-reset-token"
            | .paths["/v1/authentication/social-login"].post.requestBody.content["application/json"].schema.properties.token.example = "example-provider-token"
            | .components.schemas.ApiKey.properties.api_key.example = "example-api-key"
            | .components.schemas.AuthSession.properties.access_token.example = "example-access-token"
            | walk(if type == "string" then gsub("@(email|test|kemmer|yahoo)\\.com"; "@example.com") else . end)
          '
          jq -S . docs/openapi.json > "$RUNNER_TEMP/openapi.checked-in.json"
          jq -S "$snapshot_filter" "$RUNNER_TEMP/openapi.json" > "$RUNNER_TEMP/openapi.production.json"
          cmp "$RUNNER_TEMP/openapi.checked-in.json" "$RUNNER_TEMP/openapi.production.json"
          snapshot_hash="$(sha256sum docs/openapi.json | cut -d ' ' -f 1)"
          grep -Fq "$snapshot_hash" docs/API.md

      - name: Pack
        run: dotnet pack src/Assinafy.Sdk/Assinafy.Sdk.csproj --configuration Release --output ./artifacts

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: ./artifacts/*.nupkg
