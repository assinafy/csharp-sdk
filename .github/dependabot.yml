version: 2
updates:
  # Keep GitHub Actions pinned versions current (checkout, setup-dotnet, upload-artifact, attest, …).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Keep NuGet dependencies (Microsoft.Extensions.*, test packages) current.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    ignore:
      # FluentAssertions 8+ switched from Apache-2.0 to the Xceed license, which
      # requires a paid seat for commercial use. 7.x is the last Apache-2.0 line.
      - dependency-name: FluentAssertions
        versions: [">=8.0.0"]
      # The csproj pins one Microsoft.Extensions major per TargetFramework (8/9/10)
      # so net8.0 consumers aren't dragged onto .NET 10 runtime packages. Majors
      # move by hand when a TFM is added; patches within a major still auto-bump.
      - dependency-name: Microsoft.Extensions.*
        update-types: [version-update:semver-major]
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
