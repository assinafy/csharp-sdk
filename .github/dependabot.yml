version: 2
updates:
  # Keep GitHub Actions pinned versions current (checkout, setup-dotnet, upload-artifact, attest, …).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Keep NuGet dependencies (Microsoft.Extensions.*, test packages) current.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
