version: 2
updates:
  # Keep GitHub Actions pinned versions current (checkout, setup-dotnet, upload-artifact, attest, …).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Keep NuGet dependencies (Microsoft.Extensions.*, test packages) current.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    ignore:
      # FluentAssertions 8+ switched from Apache-2.0 to the Xceed license, which
      # requires a paid seat for commercial use. 7.x is the last Apache-2.0 line.
      - dependency-name: FluentAssertions
        versions: [">=8.0.0"]
      # Microsoft.Extensions.* is test-only (it verifies the container registration the
      # README documents); the shipped package has no dependencies. Majors move by hand
      # with the .NET LTS the tests target; patches still auto-bump.
      - dependency-name: Microsoft.Extensions.*
        update-types: [version-update:semver-major]
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
